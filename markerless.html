<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
    <title>Furniture AR — Markerless</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <link rel="stylesheet" href="css/markerless.css">
</head>

<body>

    <div id="topbar">
        <button id="back-btn" title="Back">&#8592;</button>
        <div id="topbar-right">
            <button id="reset-btn" title="Clear placement">&#8635;</button>
            <button id="mute-btn" title="Mute sound">&#128266;</button>
        </div>
    </div>

    <div id="ar-hint"></div>

    <model-viewer id="viewer" camera-controls shadow-intensity="1" src="assets/models/chair_1.glb"></model-viewer>

    <canvas id="ar-canvas"></canvas>

    <div id="bottom-panel">
        <div id="model-picker-wrap">
            <div id="model-picker"></div>
        </div>
        <button id="start-ar-btn" type="button"><span class="badge">AR</span>View in your room</button>
        <div id="ar-unsupported">AR isn't available on this device/browser — you can still rotate and preview the
            model above.</div>
    </div>

    <script type="module" src="js/markerless.js"></script>
</body>

</html>
