<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>Furniture AR Viewer</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <link rel="stylesheet" href="css/index.css">
</head>

<body>

    <!-- ══ LANDING PAGE ══ -->
    <div id="landing">
        <div class="logo-icon">🛋️</div>
        <h1>Furniture <span>AR</span> Viewer</h1>
        <p>View true-to-size furniture in your space using augmented reality</p>

        <button class="landing-btn btn-primary" id="scan-catalog-btn">
            <span class="btn-icon">📷</span>
            <span class="btn-text">
                <strong>Scan Catalog</strong>
                <small>Point camera at a catalog marker</small>
            </span>
        </button>

        <button class="landing-btn btn-secondary" id="place-room-btn">
            <span class="btn-icon">🏠</span>
            <span class="btn-text">
                <strong>Place in My Room</strong>
                <small>Markerless — scan any surface</small>
            </span>
        </button>

        <div class="landing-footer">Furniture AR Viewer · v1.0</div>
    </div>

    <!-- ══ A-FRAME SCENE — always in DOM so WebGL initialises at page load ══ -->
    <a-scene mindar-image="imageTargetSrc: assets/markers/targets.mind; autoStart: true; uiScanning: yes;"
        color-space="sRGB" renderer="colorManagement: true; toneMapping: ACESFilmic; exposure: 1.2; alpha: false"
        background="color: #849CDB" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">

        <a-assets>
            <a-asset-item id="chair-1-model" src="assets/models/chair_1.glb"></a-asset-item>
            <a-asset-item id="rocking-chair-model" src="assets/models/rocking_chair.glb"></a-asset-item>
            <a-asset-item id="chair-small-model" src="assets/models/chair_small.glb"></a-asset-item>
            <a-asset-item id="adjustable-desk-model" src="assets/models/adjustable_desk.glb"></a-asset-item>
            <a-asset-item id="coffee-table-model" src="assets/models/coffee_table.glb"></a-asset-item>
            <a-asset-item id="folding-table-model" src="assets/models/folding_table.glb"></a-asset-item>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0" id="ar-target">
            <a-entity id="furniture-model" gltf-model="assets/models/chair_1.glb" scale="0.1 0.1 0.1" position="0 0 0"
                rotation="0 0 0" animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear">
            </a-entity>

            <a-light type="hemisphere" color="#ffffff" ground-color="#444466" intensity="0.9"></a-light>
            <a-light type="directional" intensity="1.0" position="1 2 1"></a-light>
            <a-light type="directional" intensity="0.4" position="-1 0.5 -1"></a-light>
        </a-entity>

    </a-scene>

    <!-- ══ AR VIEW UI OVERLAY ══ -->
    <div id="ar-view">

        <!-- Top bar -->
        <div id="ar-topbar">
            <button id="back-btn" title="Back">&#8592;</button>
            <div id="ar-topbar-title">
                Scan Catalog
                <small>Point at the catalog marker</small>
            </div>
        </div>

        <!-- Scanning crosshair -->
        <div id="scan-hint">
            <div class="scan-frame">
                <span class="corner-br"></span>
                <span class="corner-bl"></span>
            </div>
            <p>Point camera at the catalog marker</p>
        </div>

        <!-- Model name badge — tap to reveal price/details -->
        <button id="model-badge" type="button">
            <span id="badge-name">Chair 1</span>
            <span class="badge-price" id="badge-price"></span>
            <span class="badge-chevron">&#9662;</span>
        </button>
        <div id="model-details"></div>

        <!-- Bottom panel: size controls + model picker -->
        <div id="bottom-panel">
            <div id="size-row">
                <span>Size</span>
                <button class="size-btn" type="button" id="size-down">−</button>
                <button id="size-reset-btn" type="button">Reset</button>
                <button class="size-btn" type="button" id="size-up">+</button>
            </div>
            <div id="model-picker"></div>
        </div>

    </div>

    <script>
        // Base scale is derived from each model's real bounding box so it renders near actual furniture size.
        // Models vary in source units (some already in meters, some not), so these are per-model tuned starting points.
        // Using the direct file path (not "#asset-id") because A-Frame's "#id" resolution is unreliable across repeated runtime updates.
        var MODELS = [
            {
                key: "chair_1", label: "Chair 1", assetPath: "assets/models/chair_1.glb", baseScale: 0.35,
                details: {
                    name: "Classic Armchair", category: "Chairs", price: 149.99, currency: "LKR",
                    description: "A traditional wooden-frame armchair with a bold mustard-yellow upholstered body, contrasting red backrest panel, and tan seat cushion.",
                    dimensions: { width: 70, height: 95, depth: 75, unit: "cm" },
                    material: "Solid wood frame, fabric upholstery",
                    color: "Mustard Yellow / Red / Tan",
                    weight: "10 kg", inStock: true, rating: 4.6, sku: "CH-ARM-001"
                }
            },
            {
                key: "rocking_chair", label: "Rocking Chair", assetPath: "assets/models/rocking_chair.glb", baseScale: 0.4,
                details: {
                    name: "Wooden Rocking Chair", category: "Chairs", price: 179.99, currency: "LKR",
                    description: "A classic Mission-style wooden rocking chair with slatted backrest, curved armrests, and a padded cream cushion seat.",
                    dimensions: { width: 68, height: 110, depth: 90, unit: "cm" },
                    material: "Solid oak wood, fabric cushion",
                    color: "Dark Walnut / Cream",
                    weight: "13 kg", inStock: true, rating: 4.7, sku: "CH-ROC-002"
                }
            },
            {
                key: "chair_small", label: "Chair (Small)", assetPath: "assets/models/chair_small.glb", baseScale: 0.35,
                details: {
                    name: "Bistro Side Chair", category: "Chairs", price: 64.99, currency: "LKR",
                    description: "A compact bronze-toned bistro chair with a curved ladder back and octagonal seat, ideal for small dining spaces.",
                    dimensions: { width: 45, height: 88, depth: 48, unit: "cm" },
                    material: "Powder-coated metal",
                    color: "Antique Bronze",
                    weight: "5 kg", inStock: true, rating: 4.3, sku: "CH-BST-003"
                }
            },
            {
                key: "adjustable_desk", label: "Adj. Desk", assetPath: "assets/models/adjustable_desk.glb", baseScale: 0.6,
                details: {
                    name: "Adjustable Standing Desk", category: "Desks", price: 349.99, currency: "LKR",
                    description: "An electric height-adjustable desk with a corner-cut work surface and dual-motor lift columns, suited for home office setups.",
                    dimensions: { width: 160, height: 120, depth: 80, unit: "cm" },
                    material: "Engineered wood top, steel frame",
                    color: "Matte Black",
                    weight: "35 kg", inStock: true, rating: 4.8, sku: "DK-ADJ-001"
                }
            },
            {
                key: "coffee_table", label: "Coffee Table", assetPath: "assets/models/coffee_table.glb", baseScale: 0.6,
                details: {
                    name: "Modular Coffee Table Set", category: "Tables", price: 219.99, currency: "LKR",
                    description: "A two-piece glass-top coffee table set with a matte black metal frame and open lower shelf, designed to be arranged together or separately.",
                    dimensions: { width: 120, height: 40, depth: 60, unit: "cm" },
                    material: "Tempered glass, powder-coated steel",
                    color: "Matte Black",
                    weight: "18 kg", inStock: true, rating: 4.5, sku: "TB-COF-001"
                }
            },
            {
                key: "folding_table", label: "Folding Table", assetPath: "assets/models/folding_table.glb", baseScale: 0.35,
                details: {
                    name: "Folding Utility Table", category: "Tables", price: 54.99, currency: "LKR",
                    description: "A lightweight white folding table with collapsible metal legs, ideal for events, temporary workspaces, or storage-friendly setups.",
                    dimensions: { width: 180, height: 74, depth: 75, unit: "cm" },
                    material: "Plastic top, steel folding legs",
                    color: "White",
                    weight: "9 kg", inStock: true, rating: 4.1, sku: "TB-FLD-002"
                }
            }
        ];

        document.addEventListener("DOMContentLoaded", function () {
            var landing = document.getElementById("landing");
            var arView = document.getElementById("ar-view");
            var scanHint = document.getElementById("scan-hint");
            var badge = document.getElementById("model-badge");
            var badgeName = document.getElementById("badge-name");
            var badgePrice = document.getElementById("badge-price");
            var details = document.getElementById("model-details");
            var picker = document.getElementById("model-picker");
            var modelEntity = document.getElementById("furniture-model");
            var arTarget = document.getElementById("ar-target");

            var sizeMultiplier = 1;
            var currentModel = MODELS[0];

            // ── Landing navigation ──────────────────────────────────────
            document.getElementById("scan-catalog-btn").addEventListener("click", function () {
                landing.style.display = "none";
                arView.classList.add("active");
                // badge starts hidden until marker is found; show via targetFound event
                badge.style.visibility = "hidden";
                badge.style.opacity = "0";
            });

            document.getElementById("place-room-btn").addEventListener("click", function () {
                window.location.href = "markerless.html";
            });

            document.getElementById("back-btn").addEventListener("click", function () {
                arView.classList.remove("active");
                landing.style.display = "flex";
                collapseDetails();
            });

            // ── Marker tracking: show/hide scan hint and badge ───────────
            arTarget.addEventListener("targetFound", function () {
                scanHint.classList.add("hidden");
                badge.style.visibility = "visible";
                badge.style.opacity = "1";
            });
            arTarget.addEventListener("targetLost", function () {
                scanHint.classList.remove("hidden");
                badge.style.visibility = "hidden";
                badge.style.opacity = "0";
                collapseDetails();
            });

            // ── Scale helpers ────────────────────────────────────────────
            function applyScale() {
                var s = currentModel.baseScale * sizeMultiplier;
                modelEntity.setAttribute("scale", s + " " + s + " " + s);
            }

            // ── Details/price card ────────────────────────────────────────
            function formatDetails(d) {
                var stockClass = d.inStock ? "in-stock" : "out-stock";
                var stockLabel = d.inStock ? "In Stock" : "Out of Stock";
                return (
                    '<div class="detail-row">' +
                    '<span class="detail-price">' + d.currency + " " + d.price.toFixed(2) + "</span>" +
                    '<span class="detail-rating">&#9733; ' + d.rating.toFixed(1) + "</span>" +
                    '<span class="detail-stock ' + stockClass + '">' + stockLabel + "</span>" +
                    "</div>" +
                    '<p class="detail-desc">' + d.description + "</p>" +
                    '<div class="detail-specs">' +
                    "<span>" + d.dimensions.width + "&times;" + d.dimensions.height + "&times;" + d.dimensions.depth + " " + d.dimensions.unit + "</span>" +
                    "<span>" + d.material + "</span>" +
                    "<span>" + d.color + "</span>" +
                    "</div>" +
                    '<div class="detail-sku">SKU: ' + d.sku + "</div>"
                );
            }

            function collapseDetails() {
                badge.classList.remove("expanded");
                details.classList.remove("expanded");
            }

            badge.addEventListener("click", function () {
                badge.classList.toggle("expanded");
                details.classList.toggle("expanded");
            });

            // ── Model switching ──────────────────────────────────────────
            function selectModel(model, button) {
                currentModel = model;
                sizeMultiplier = 1;
                modelEntity.setAttribute("gltf-model", model.assetPath);
                applyScale();
                badgeName.textContent = model.label;
                badgePrice.textContent = model.details.currency + " " + model.details.price.toFixed(2);
                details.innerHTML = formatDetails(model.details);
                collapseDetails();
                Array.prototype.forEach.call(picker.children, function (btn) {
                    btn.classList.remove("active");
                });
                button.classList.add("active");
            }

            MODELS.forEach(function (model, index) {
                var btn = document.createElement("button");
                btn.type = "button";
                btn.textContent = model.label;
                btn.addEventListener("click", function () { selectModel(model, btn); });
                picker.appendChild(btn);
                if (index === 0) selectModel(model, btn);
            });

            // ── Size controls ────────────────────────────────────────────
            document.getElementById("size-up").addEventListener("click", function () {
                sizeMultiplier *= 1.15;
                applyScale();
            });
            document.getElementById("size-down").addEventListener("click", function () {
                sizeMultiplier /= 1.15;
                applyScale();
            });
            document.getElementById("size-reset-btn").addEventListener("click", function () {
                sizeMultiplier = 1;
                applyScale();
            });
        });
    </script>
</body>

</html>
